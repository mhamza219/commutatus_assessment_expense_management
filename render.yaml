# Render Blueprint Specification
# Free / Trial Tier Deployment Configuration
services:
  - type: web
    name: splitwise-clone
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /users/sign_in
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: splitwise-db
          property: connectionString

databases:
  - name: splitwise-db
    plan: free
    databaseName: splitwise_production
    user: splitwise_user
